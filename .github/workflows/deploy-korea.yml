name: Deploy to Korea VPS

# Optional: pushes the gh-pages demo to a personal VPS. This repository is a fork, so those
# secrets normally do not exist — the job then skips itself instead of failing on every demo
# build. Add VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_KNOWN_HOSTS (and optional VPS_PORT) to
# enable it.
on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-korea
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check configuration
        id: cfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_KNOWN_HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS deploy is not configured (missing:$missing) — skipping. See the header of .github/workflows/deploy-korea.yml."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout published website
        if: steps.cfg.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false

      - name: Install deployment tools
        if: steps.cfg.outputs.skip != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        if: steps.cfg.outputs.skip != '1'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY is empty"
            exit 1
          fi

          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS is empty"
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          echo "SSH configuration completed"

      - name: Test SSH connection
        if: steps.cfg.outputs.skip != '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          VPS_PORT="${VPS_PORT:-22}"

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]] ||
             [ "$VPS_PORT" -lt 1 ] ||
             [ "$VPS_PORT" -gt 65535 ]; then
            echo "::error::Invalid SSH port"
            exit 1
          fi

          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::error::VPS_HOST or VPS_USER is empty"
            exit 1
          fi

          ssh \
            -p "$VPS_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" \
            "hostname && whoami && test -d /var/www/demo && test -w /var/www/demo"

          echo "SSH connection successful"

      - name: Verify website files
        if: steps.cfg.outputs.skip != '1'
        run: |
          set -euo pipefail

          if [ ! -f index.html ]; then
            echo "::error::index.html not found in gh-pages branch"
            exit 1
          fi

          echo "Website files verified"

      - name: Deploy website to Korea VPS
        if: steps.cfg.outputs.skip != '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          VPS_PORT="${VPS_PORT:-22}"

          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -p ${VPS_PORT} -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ \
            "${VPS_USER}@${VPS_HOST}:/var/www/demo/"

          echo "Website deployment completed"

      - name: Verify deployment
        if: steps.cfg.outputs.skip != '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          VPS_PORT="${VPS_PORT:-22}"

          ssh \
            -p "$VPS_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "test -s /var/www/demo/index.html && ls -lah /var/www/demo | head -20"

          echo "Deployment verification successful"

      - name: Deployment summary
        if: steps.cfg.outputs.skip != '1' && success()
        run: |
          echo "## Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Server: KR-CHUNCHEON-FREE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Directory: /var/www/demo" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: gh-pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Success" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -f ~/.ssh/known_hosts
